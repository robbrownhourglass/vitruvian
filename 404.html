<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Vitruvian Lime</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c3a40">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Self-contained: GitHub Pages serves this file at any missing path, so relative asset links can't be relied on. */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c3a40; color: rgba(255,255,255,.85); font: 16px/1.7 "Montserrat", system-ui, sans-serif; text-align: center; padding: 16px; }
    h1 { font: 500 clamp(2.4rem, 7vw, 4rem)/1.1 "Cormorant Garamond", Georgia, serif; color: #fff; margin: 0 0 .5em; }
    .eyebrow { font-size: .75rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #c6a85b; }
    a { display: inline-block; margin-top: 1.5rem; padding: .9em 1.6em; background: #f6f3ec; color: #0c3a40; border-radius: 4px; font-weight: 600; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; }
    a:hover { background: #fff; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404</p>
    <h1>This page has moved on</h1>
    <p>The page you’re looking for doesn’t exist, or has been moved as part of our new website.</p>
    <a href="/" id="home">Back to the home page</a>
  </main>
  <script>
    // Works for both a custom domain (/) and a project site (/repo-name/)
    const seg = location.pathname.split("/")[1];
    if (location.hostname.endsWith("github.io") && seg) document.getElementById("home").href = "/" + seg + "/";
  </script>
</body>
</html>
